<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>UITProject</h1>
      <p>
        @if (isRegister()) {
          <span i18n>Create an account</span>
        } @else {
          <span i18n>Sign in to start chatting</span>
        }
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="form-group">
        <label for="username" i18n>Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          i18n-placeholder
          autocomplete="username"
        />
      </div>

      @if (isRegister()) {
        <div class="form-group">
          <label for="displayName" i18n>Display Name</label>
          <input
            id="displayName"
            type="text"
            [(ngModel)]="displayName"
            name="displayName"
            placeholder="Enter your display name"
            i18n-placeholder
          />
        </div>
      }

      <div class="form-group">
        <label for="password" i18n>Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          i18n-placeholder
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          @if (isRegister()) {
            <span i18n>Creating...</span>
          } @else {
            <span i18n>Signing in...</span>
          }
        } @else {
          @if (isRegister()) {
            <span i18n>Register</span>
          } @else {
            <span i18n>Sign In</span>
          }
        }
      </button>

      <p class="toggle-link" (click)="toggleMode()">
        @if (isRegister()) {
          <span i18n>Already have an account? Sign in</span>
        } @else {
          <span i18n>Don't have an account? Register</span>
        }
      </p>
    </form>
  </div>
</div>
