<div class="app-shell">
	<div
		class="locale-switcher"
		role="group"
		aria-label="Language"
		i18n-aria-label="@@languageSwitcherLabel"
	>
		<button
			type="button"
			class="locale-btn"
			[class.active]="currentLocale === 'en-US'"
			[attr.aria-pressed]="currentLocale === 'en-US'"
			(click)="switchLocale('en-US')"
			title="English"
			i18n-title="@@languageEnglish"
		>
			EN
		</button>
		<button
			type="button"
			class="locale-btn"
			[class.active]="currentLocale === 'fr-FR'"
			[attr.aria-pressed]="currentLocale === 'fr-FR'"
			(click)="switchLocale('fr-FR')"
			title="French"
			i18n-title="@@languageFrench"
		>
			FR
		</button>
	</div>

	<router-outlet />
</div>
